name: Validate Flux

on:
  pull_request:
    paths:
      - "helm/**"
      - ".github/workflows/validate-flux.yaml"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Flux manifests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Flux CLI
        uses: fluxcd/flux2/action@main

      - name: Check Flux prerequisites
        run: flux check --pre

      - name: Validate Kubernetes YAML
        run: |
          find . \
            -type f \( -name "*.yaml" -o -name "*.yml" \) \
            -not -path "./.git/*" \
            -print0 |
          xargs -0 -r -n1 kubectl apply --dry-run=client --validate=false -f

      - name: Validate Flux manifests
        run: |
          flux build kustomization flux-system \
            --path ./clusters/production \
            --dry-run